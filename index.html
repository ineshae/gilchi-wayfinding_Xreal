<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XReal · 소리로 찾는 길</title>
<meta name="description" content="AR 길치를 위한 길찾기 · VR 길찾기 리듬게임 · VR 게임 SOUNDRE:VERSE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
:root{ color-scheme:dark; --bg:#000; --ink:#fff; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:clamp(16px,4vw,64px)}
.cards{width:min(1520px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3.4vw,52px)}
.card{position:relative;display:grid;place-items:center;aspect-ratio:465/810;max-height:calc(100dvh - 2*clamp(16px,4vw,64px));border-radius:28px;text-decoration:none;color:var(--ink);text-align:center;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 0 22px rgba(255,255,255,.16),0 0 2px rgba(255,255,255,.4);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,filter .35s;overflow:hidden;isolation:isolate}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 60% at 50% 110%,rgba(255,255,255,.18),transparent 60%);opacity:0;transition:opacity .35s}
.card:hover,.card:focus-visible{transform:translateY(-8px) scale(1.015);box-shadow:0 0 38px rgba(255,255,255,.3),0 0 2px rgba(255,255,255,.7);filter:brightness(1.08)}
.card:hover::after,.card:focus-visible::after{opacity:1}
.card:focus-visible{outline:3px solid #fff;outline-offset:6px}
.card:active{transform:translateY(-3px) scale(.99)}
.ar{background:linear-gradient(180deg,#1a2d34 0%,#21414a 45%,#33656f 100%)}
.rhythm{background:linear-gradient(180deg,#283163 0%,#3c4890 45%,#5866c8 100%)}
.sv{background:linear-gradient(180deg,#0e1f48 0%,#173a7e 50%,#2456aa 100%)}
.t{font-weight:800;font-size:clamp(22px,2.6vw,46px);line-height:1.5;letter-spacing:-.01em;text-shadow:0 2px 16px rgba(0,0,0,.25);padding:0 12px}
.t span{display:block;white-space:nowrap}
.go{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-weight:700;font-size:clamp(12px,1vw,15px);letter-spacing:.06em;color:rgba(255,255,255,.72);opacity:0;transition:opacity .35s,bottom .35s}
.card:hover .go,.card:focus-visible .go{opacity:1;bottom:8%}
@media (max-width:760px){
  .cards{grid-template-columns:1fr;gap:16px}
  .card{aspect-ratio:auto;min-height:clamp(150px,26vh,240px);border-radius:22px}
  .t{font-size:clamp(22px,6.4vw,30px)}
  .go{opacity:1;bottom:12px}
}
@media (prefers-reduced-motion:reduce){.card,.card::after,.go{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <h1 class="sr">서비스 고르기</h1>
  <nav class="cards" aria-label="서비스 고르기">
    <a class="card ar" href="wayfinding.html"><div class="t"><span>AR</span><span>(길치를 위한 길찾기)</span></div><div class="go">들어가기 →</div></a>
    <a class="card rhythm" href="game.html"><div class="t"><span>VR게임</span><span>길찾기 리듬게임</span></div><div class="go">들어가기 →</div></a>
    <a class="card sv" href="soundverse.html"><div class="t"><span>VR게임</span><span>SOUNDRE:VERSE</span></div><div class="go">들어가기 →</div></a>
  </nav>
</main>
</body>
</html>
